apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuralforge-ui
  namespace: train-service
  labels:
    app.kubernetes.io/name: neuralforge-ui
    app.kubernetes.io/part-of: train-service2
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: neuralforge-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuralforge-ui
        app.kubernetes.io/part-of: train-service2
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: ui
          image: wisrovi/train_service:w_darwin_ops_frontend_v1.1.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: neuralforge-control-config
            - secretRef:
                name: train-service-secrets
          ports:
            - name: http-ui
              containerPort: 4173
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 4173
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 4173
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: neuralforge-ui-svc
  namespace: train-service
  labels:
    app.kubernetes.io/name: neuralforge-ui
    app.kubernetes.io/part-of: train-service2
    app.kubernetes.io/component: frontend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: neuralforge-ui
  ports:
    - name: http-ui
      port: 4173
      targetPort: 4173
      nodePort: 32432
      protocol: TCP
