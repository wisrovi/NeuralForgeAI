apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuralforge-manager
  namespace: train-service
  labels:
    app.kubernetes.io/name: neuralforge-manager
    app.kubernetes.io/part-of: train-service2
    app.kubernetes.io/component: orchestrator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: neuralforge-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuralforge-manager
        app.kubernetes.io/part-of: train-service2
        app.kubernetes.io/component: orchestrator
    spec:
      containers:
        - name: manager
          image: wisrovi/train_service:manager_orchestrator_v1.2.2
          imagePullPolicy: Always
          command:
            - celery
            - -A
            - app.user_orchestrator
            - worker
            - -Q
            - managers
            - --concurrency=10
            - -P
            - threads
            - --loglevel=info
          envFrom:
            - configMapRef:
                name: neuralforge-control-config
            - secretRef:
                name: train-service-secrets
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
