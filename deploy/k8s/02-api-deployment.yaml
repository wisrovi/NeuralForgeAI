apiVersion: apps/v1
kind: Deployment
metadata:
  name: neuralforge-api
  namespace: train-service
  labels:
    app.kubernetes.io/name: neuralforge-api
    app.kubernetes.io/part-of: train-service2
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: neuralforge-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neuralforge-api
        app.kubernetes.io/part-of: train-service2
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: api
          image: wisrovi/train_service:api_server_v1.2.2
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: neuralforge-control-config
            - secretRef:
                name: train-service-secrets
          ports:
            - name: http-api
              containerPort: 8000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: neuralforge-api-svc
  namespace: train-service
  labels:
    app.kubernetes.io/name: neuralforge-api
    app.kubernetes.io/part-of: train-service2
    app.kubernetes.io/component: backend
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: neuralforge-api
  ports:
    - name: http-api
      port: 8000
      targetPort: 8000
      nodePort: 32442
      protocol: TCP
